# Thông số của pipeline. Sửa ở đây, không sửa trong code. File này không chứa khóa bí mật
# (tài khoản Kaggle và khóa API nằm trong config.toml ở thư mục gốc).
# Mô tả nhân vật: config/characters.json. Prompt bối cảnh: config/locations.json.

[generation]        # sinh ảnh trên Kaggle; cả mục này được gửi lên kèm jobs.json
model = "black-forest-labs/FLUX.2-klein-4B"
lora_file = "irasutoya_style_v1.safetensors"   # = checkpoint 750, tên file trong dataset LoRA trên Kaggle
size_text = 1024     # cạnh ảnh sinh từ chữ; đã đo vừa T4
size_ref = 768       # cạnh ảnh có ảnh tham chiếu; 1024 hết VRAM trên T4
ref_size = 512       # ảnh tham chiếu được thu về cạnh này trước khi đưa vào model
steps = 4
seed = 42
ref_wait = 900       # giây tối đa một ảnh chờ ảnh tham chiếu do GPU khác sinh; quá thì báo lỗi

[background]        # ảnh nền, do tools/make_bg_jobs.py đưa vào jobs.json
lora = 0.8           # cố định: cường độ style LoRA cho nền (đã thử 0 / 0.5 / 0.8 / 1.0, chọn 0.8)
width = 768          # 768 x 1344 gần 9:16; khi dựng được phóng lên 1080 x 1920
height = 1344

[cutout]            # bước 4, tách nền
# Ảnh nhân vật và đồ vật sinh trên nền màu đặc rồi tách theo màu (đã thử: nền trắng làm áo trắng, bọt bia bị khoét thủng)
key_prompt = "on a solid flat pure green background (#00FF00), no shadow"
key_low = 70         # khoảng cách màu tới màu nền (0-441) dưới mức này: trong suốt hoàn toàn
key_high = 140       # trên mức này: đục hoàn toàn; ở giữa: viền mềm
spill_min_bright = 120   # khử ánh màu nền chỉ ở pixel sáng (hai kênh kia đều >= mức này): thủy tinh, bọt, áo trắng
spill_max = 90           # và chỉ khi kênh màu nền vượt không quá mức này (màu xanh lá thật vượt nhiều hơn)
model = "isnet-general-use"   # chỉ dùng cho ảnh nền trắng cũ; ~0,7 giây/ảnh; "bria-rmbg" (mặc định của rembg) ~15 giây/ảnh và ~13GB RAM

[voice]             # bước 6; giọng của từng nhân vật nằm trong config/characters.json
silence_db = -45     # cắt khoảng lặng đầu và cuối câu dưới ngưỡng này (dB)
tempo = 1.2          # tốc độ đọc (giữ cao độ; góp ý 2026-10-08: TTS 1.2-1.5x, video 45-60 giây); áp cho file giọng mới
engine = "voicevox"  # kịch bản có "voices" (AI chọn giọng VOICEVOX) thì đọc bằng VOICEVOX đang mở ở máy; "edge": luôn dùng edge-tts
voicevox_engine = "%LOCALAPPDATA%/Microsoft/WinGet/Packages/HiroshibaKazuyuki.VOICEVOX.CPU_Microsoft.Winget.Source_8wekyb3d8bbwe/VOICEVOX/vv-engine/run.exe"   # bước giọng đọc tự bật nếu VOICEVOX chưa chạy
voicevox_speed = 1.2    # tốc độ đọc trong VOICEVOX (1.0 = chậm như video 022; 1.35 nhanh quá ở video 023); sau đó còn tempo ở trên
min_video_seconds = 62  # tổng giọng + nghỉ dưới mức này thì đọc lại chậm hơn cho video luôn trên 1 phút

[video]             # bước 7
pad = 0.08           # giây nghỉ sau mỗi câu (trước 0.15; góp ý: nhịp nhanh hơn)
min_seconds = 61.0   # video ngắn hơn thì cảnh cuối giữ thêm cho đủ (TikTok tính tiền từ 60 giây; người dùng 2026-10-11)
idle_motion = true   # nhân vật luôn thở, đung đưa nhẹ thân trên (dựng chậm hơn ~20%)
sfx_below_voice = 7  # (12 → 7: người dùng muốn hiệu ứng to hơn chút, vẫn dưới giọng) hiệu ứng nhỏ hơn giọng nói của cảnh bao nhiêu dB (đo độ to từng file rồi chỉnh); số lớn = nhỏ hơn
ambient_below_voice = 22 # tiếng nền (mưa, ga tàu, lớp học... library/sfx/lab/amb_*) nhỏ hơn giọng bao nhiêu dB
sfx_volume = 1.0     # nhân thêm sau khi đã chỉnh theo giọng; 0 để tắt hiệu ứng
ambient_volume = 1.0 # nhân thêm cho tiếng nền; 0 để tắt
music_volume = 0.12  # (cũ) không còn dùng: nhạc nền chỉnh theo music_below_voice
music_below_voice = 21 # nhạc nền nhỏ hơn giọng đọc bao nhiêu dB (đo độ to rồi chỉnh); library/bgm, tools/fetch_bgm.py
title_size = 160     # cỡ chữ dòng 1 tiêu đề (dòng 2 x0,8; dòng dài tự co cho vừa bề ngang) (chữ vàng viền nâu đậm trên dải đen, gần kín bề ngang như video mẫu)
title_band = 380     # chiều cao dải đen chứa tiêu đề ở trên cùng (px); 0 để bỏ dải
subtitle_size = 122  # cỡ chữ phụ đề (144 → 122 theo video mẫu: 2 dòng ~8 chữ, chữ to viền trắng dày); tự ngắt dòng
narration_colour = "#2747F5" # màu chữ lời kể (chữ màu, viền trắng như video mẫu); lời thoại dùng màu speaker, làm đậm
subtitle_margin = 30 # lề trái phải của phụ đề (px)
subtitle_top = 410   # mép trên của phụ đề (px từ đỉnh khung), ngay dưới dải tiêu đề
transition = 0.3     # giây chuyển cảnh (mờ, đẩy, lia, chớp...) ở đầu mỗi cảnh; "cut" thì không có
alt_interval = 0.25  # giây giữa hai lần đổi tư thế ở cảnh có alt_pose (bước chân, nói, vẫy tay)

[layout]            # bố cục lớp; tọa độ theo tỉ lệ khung hình, (0,0) là góc trên trái
sticker_gap = 0.015  # khoảng hở giữa sticker và đầu nhân vật (beside_left, beside_right, above)
edge_margin = 0.01   # lề tối thiểu từ lớp đứng yên ("at") tới mép khung; sticker tràn mép thì đổi bên
[layout.slots]       # vị trí có tên: tâm của lớp (x, y)
center = [0.50, 0.70]
left = [0.28, 0.72]
right = [0.72, 0.72]
top = [0.50, 0.40]
top_left = [0.20, 0.40]
top_right = [0.80, 0.40]
bottom = [0.50, 0.86]
off_left = [-0.35, 0.72]
off_right = [1.35, 0.72]
off_top = [0.50, -0.25]
off_bottom = [0.50, 1.25]

[layout.sizes]       # kích thước có tên: chiều cao của lớp so với khung hình
tiny = 0.07
small = 0.15
medium = 0.28
large = 0.68         # nhân vật toàn thân (0.42 → 0.52 → 0.62: góp ý 2026-10-08 nhân vật chiếm khoảng 2/3 khung hình)
huge = 0.74

[shots]             # khung hình của cảnh ("shot" trong script.json); quy tắc chọn: config/script_guide.md
# prompt: chèn vào prompt ảnh nhân vật; size, at: cỡ và vị trí mặc định của lớp nhân vật khi kịch bản bỏ trống
# at = "floor": đứng sát mép dưới khung hình (nửa người, cận mặt như máy quay cắt ngang người)
[shots.full]
prompt = "full body"
size = 0.70          # khoảng 2/3 khung hình, chân sát mép dưới
at = "floor"

[shots.half]
prompt = "upper body from the waist up, cropped at the waist, filling the frame"
size = 0.73
at = "floor"

[shots.close]
prompt = "close-up of the face and shoulders, cropped at the chest, filling the frame"
size = 0.69
at = "floor"

[faces]             # tools/make_faces.py: chớp mắt (vẽ bằng code) và mấp máy miệng (model ảnh) cho nhân vật
enabled = true      # false: không tạo ảnh mắt / miệng (video vẫn dựng, nhân vật không chớp, không nói)
shots = ["close", "half"]   # chỉ cảnh mặt đủ to; thêm "full" thì tốn thêm ảnh mà khó thấy
workers = 4         # số ảnh miệng gửi model cùng lúc
talk = false        # miệng mở bằng model ảnh (tốn tiền ShopAIKey); false: chỉ chớp mắt vẽ bằng code (2026-10-08 tạm tắt)
model = ""          # model ảnh cho miệng; trống = model "Sửa ảnh lỗi" ở trang Cài đặt (AI_MODEL_IMAGE)

[i2v]               # clip image-to-video trên Kaggle (Wan2.2 TI2V-5B Turbo GGUF qua ComfyUI), cho cảnh "motion_level": "low"
# Chạy cùng kernel với sinh ảnh, sau giai đoạn ảnh (kaggle_job/i2v_runner.py). Cả mục này được gửi lên kèm jobs.json.
# Mọi số dưới đây CHƯA benchmark: chạy tools/i2v_bench.py trước rồi chốt.
comfyui_commit = "0df64eb242b7c5759c3e86afd5d1846d923b1033"  # pin: bản đã chạy benchmark 2026-10-10; "" = bản mới nhất
gguf_commit = "6ea2651e7df66d7585f6ffee804b20e92fb38b8a"
unet_repo = "hum-ma/Wan2.2-TI2V-5B-Turbo-GGUF"
quant = "Q8_0"       # 5.4 GB; dự phòng "Q5_K_M" (3.8 GB)
text_encoder_repo = "city96/umt5-xxl-encoder-gguf"
text_encoder_quant = "Q5_K_M"   # Q5 trở xuống: 2 server mỗi cái nạp riêng text encoder, fp8 (~6.7 GB) dễ vượt 30 GB RAM
vae_repo = "Comfy-Org/Wan_2.2_ComfyUI_Repackaged"
vae_file = "split_files/vae/wan2.2_vae.safetensors"
models_dataset = ""  # dataset Kaggle chứa sẵn các file model (vd "wan5b-models"): gắn vào kernel, khỏi tải lại ~12 GB
upscale_url = ""     # "" = không upscale; vd "https://github.com/xinntao/Real-ESRGAN/releases/download/v0.2.5.0/realesr-animevideov3.pth" (x4, nặng RAM)
width = 576          # = cỡ tranh cả cảnh (full/NNN.png 576x1024), bội của 32, khỏi cắt mất hai bên khi dựng 9:16
height = 1024
out_size = []        # [w, h] để ffmpeg đổi cỡ clip; [] = giữ cỡ sinh (build_video.py tự phóng lên 1080x1920)
fps = 24             # FPS gốc của model
seconds = 4          # độ dài clip khi chưa có giọng đọc: 4 giây = 97 frame (4k+1)
max_frames = 121     # 5 giây
steps = 4            # bản Turbo: 4 bước, CFG 1 (negative prompt không có tác dụng)
cfg = 1.0
sampler = "euler"
scheduler = "simple"
shift = 8.0          # ModelSamplingSD3; VERIFY theo template ComfyUI chính thức cho 5B
seeds = 2            # mỗi cảnh sinh 2 seed, giữ clip điểm QA cao hơn
style_suffix = "flat 2D illustration in the same simple cute style, clean outlines, flat colors, static camera, gentle small movement only"
qa_motion_good = 3.0 # QA thô: chênh lệch trung bình giữa hai frame (0-255) đạt mức này coi là đủ chuyển động
qa_drift_max = 40.0  # frame cuối khác frame đầu quá mức này thì trừ điểm (cảnh / nét vẽ trôi)
job_timeout = 1200   # giây tối đa cho một clip
session_minutes = 720  # Kaggle 12 giờ/phiên; còn dưới 30 phút thì ngừng nhận clip mới
minutes_per_clip = 6   # cộng vào thời hạn kernel (run_timeout_minutes) cho mỗi clip
